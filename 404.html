  <style>
    :root{
      --bg:#0b0d12;
      --panel:#12151d;
      --text:#f4f5f7;
      --muted:#a2a8b6;
      --line:#292e3a;
      --lime:#c9fa72;
      --purple:#b49aff;
      --font:'DM Sans',sans-serif;
      --display:'Space Grotesk',sans-serif;
    }

    *{box-sizing:border-box;margin:0;padding:0}
    html{scroll-behavior:smooth}

    body{
      background:var(--bg);
      color:var(--text);
      font-family:var(--font);
      line-height:1.6;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
      position:relative;
      overflow:hidden;
    }

    /* Decoración de fondo */
    .orb{
      position:absolute;
      border-radius:50%;
      filter:blur(1px);
      pointer-events:none;
    }
    .orb-one{
      width:340px;height:340px;
      background:#b49aff13;
      top:-80px;right:-80px;
    }
    .orb-two{
      width:280px;height:280px;
      background:#c9fa7210;
      bottom:-80px;left:-60px;
    }

    /* Contenedor principal */
    .error-wrap{
      max-width:640px;
      width:100%;
      text-align:center;
      position:relative;
      z-index:1;
    }

    /* Marca */
    .brand{
      display:inline-flex;
      align-items:center;
      gap:11px;
      font-size:11px;
      letter-spacing:.18em;
      font-weight:700;
      color:var(--text);
      text-decoration:none;
      margin-bottom:48px;
      transition:opacity .2s;
    }
    .brand:hover{opacity:.8}
    .brand-mark{
      display:grid;
      place-items:center;
      width:36px;height:36px;
      background:var(--lime);
      color:#10130b;
      border-radius:11px;
      font-family:var(--display);
      font-size:18px;
      letter-spacing:-.08em;
    }

    /* Número 404 */
    .error-code{
      font-family:var(--display);
      font-weight:600;
      font-size:clamp(90px,18vw,150px);
      line-height:1;
      letter-spacing:-.08em;
      margin-bottom:16px;
      background:linear-gradient(100deg,var(--lime),#a8e9d0 55%,var(--purple));
      -webkit-background-clip:text;
      background-clip:text;
      color:transparent;
    }

    /* Título */
    .error-title{
      font-family:var(--display);
      font-weight:600;
      font-size:clamp(26px,4vw,36px);
      letter-spacing:-.04em;
      line-height:1.15;
      margin-bottom:16px;
    }

    /* Descripción */
    .error-text{
      font-size:14px;
      color:var(--muted);
      line-height:1.8;
      max-width:480px;
      margin:0 auto 36px;
    }

    /* Acciones */
    .error-actions{
      display:flex;
      flex-wrap:wrap;
      gap:12px;
      justify-content:center;
      margin-bottom:42px;
    }

    .btn{
      display:inline-flex;
      align-items:center;
      gap:14px;
      padding:13px 20px;
      border-radius:9px;
      font-size:12px;
      font-weight:700;
      text-decoration:none;
      transition:transform .2s,border-color .2s,background .2s;
      border:1px solid transparent;
    }
    .btn:hover{transform:translateY(-2px)}

    .btn-primary{
      background:var(--lime);
      color:#11150b;
    }
    .btn-primary span{color:#11150b}

    .btn-quiet{
      border-color:#ffffff26;
      color:var(--text);
    }
    .btn-quiet:hover{border-color:var(--lime)}
    .btn-quiet span{color:var(--lime)}

    /* Links rápidos */
    .quick-links{
      display:flex;
      justify-content:center;
      gap:22px;
      flex-wrap:wrap;
      padding-top:26px;
      border-top:1px solid var(--line);
      font-size:10px;
      letter-spacing:.14em;
      color:#7c8493;
      text-transform:uppercase;
    }
    .quick-links a{
      color:#9aa2b0;
      text-decoration:none;
      transition:color .2s;
    }
    .quick-links a:hover{color:var(--lime)}

    /* Punto verde */
    .dot{
      display:inline-block;
      width:6px;height:6px;
      border-radius:50%;
      background:var(--lime);
      box-shadow:0 0 10px #c9fa7280;
      margin-right:7px;
      vertical-align:middle;
    }

    @media(max-width:520px){
      .brand{margin-bottom:36px}
      .error-text{font-size:13px;margin-bottom:28px}
      .error-actions{flex-direction:column;align-items:stretch}
      .btn{justify-content:center}
      .quick-links{gap:16px;font-size:9px}
    }

        /* Botón flotante WhatsApp */
    .whatsapp-float{
      position:fixed;
      bottom:24px;
      right:24px;
      width:56px;height:56px;
      border-radius:50%;
      background:#25D366;
      color:#ffffff;
      display:grid;
      place-items:center;
      box-shadow:0 8px 24px #25d3664d,0 0 0 0 #25d36666;
      z-index:999;
      text-decoration:none;
      transition:transform .25s,box-shadow .25s;
      animation:whatsapp-pulse 2.4s infinite;
    }
    .whatsapp-float:hover{
      transform:scale(1.1);
      box-shadow:0 12px 32px #25d36680;
    }
    @keyframes whatsapp-pulse{
      0%{box-shadow:0 8px 24px #25d3664d,0 0 0 0 #25d36666}
      70%{box-shadow:0 8px 24px #25d3664d,0 0 0 14px #25d36600}
      100%{box-shadow:0 8px 24px #25d3664d,0 0 0 0 #25d36600}
    }
    @media(max-width:620px){
      .whatsapp-float{bottom:18px;right:18px;width:52px;height:52px}
    }
  </style>
